<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulta tus citas, apartados, compras y saldo Mova.">
  <title>Mis Citas y Apartados | Mova</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css?v=ticket-1">
  <link rel="stylesheet" href="css/variables.css?v=agenda-1">
  <link rel="stylesheet" href="css/agenda.css?v=cancelar-2">
</head>
<body class="pagina-agenda">
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="Mova, inicio"><img src="imagenes/logo-acceso.png" alt="Mova" width="110" height="44"></a>
      <nav class="header-nav" aria-label="Navegación principal">
        <a href="index.html" class="btn btn--ghost btn--sm">Explorar</a>
        <button id="btn-logout-cliente" class="btn btn--ghost btn--sm">Salir</button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <section class="cliente-hero">
      <div class="container container--lg">
        <h1>Mis Citas y Apartados</h1>
        <p>Administra tus reservas y presenta tus tickets al recoger.</p>
        <div class="monedero-cliente" aria-label="Saldo del monedero">
          <div>
            <span class="text-sm text-muted">Saldo actual</span>
            <div id="saldo-monedero" class="monedero-cliente__saldo">$0.00</div>
          </div>
          <div class="flex gap-2" style="flex-wrap:wrap;">
            <label class="sr-only" for="monto-recarga">Monto a recargar</label>
            <select id="monto-recarga" class="form-control" aria-label="Monto a recargar">
              <option value="200">$200</option>
              <option value="500" selected>$500</option>
              <option value="1000">$1,000</option>
            </select>
            <button id="btn-recargar" class="btn btn--primary">Recarga rápida</button>
          </div>
        </div>
      </div>
    </section>

    <section class="cliente-layout">
      <div class="container container--lg">
        <div class="cliente-tabs" role="tablist" aria-label="Contenido del cliente">
          <button class="cliente-tab active" id="tab-citas" role="tab" aria-selected="true" aria-controls="panel-citas" data-tab="citas">Mis Citas</button>
          <button class="cliente-tab" id="tab-apartados" role="tab" aria-selected="false" aria-controls="panel-apartados" data-tab="apartados">Mis Apartados y Compras</button>
        </div>
        <section id="panel-citas" role="tabpanel" aria-labelledby="tab-citas">
          <div id="lista-citas" class="cliente-lista" aria-live="polite"><span class="spinner"></span></div>
        </section>
        <section id="panel-apartados" role="tabpanel" aria-labelledby="tab-apartados" hidden>
          <div id="lista-apartados" class="cliente-lista" aria-live="polite"><span class="spinner"></span></div>
        </section>
      </div>
    </section>
  </main>
  <dialog id="dialogo-cancelacion" class="cancelacion-dialogo" aria-labelledby="cancelacion-titulo" aria-describedby="cancelacion-detalle">
    <div class="cancelacion-dialogo__icono" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-11 3 4 4m0-4-4 4"/></svg>
    </div>
    <h2 id="cancelacion-titulo">¿Cancelar esta cita?</h2>
    <p id="cancelacion-cita" class="cancelacion-dialogo__cita"></p>
    <p id="cancelacion-detalle" class="cancelacion-dialogo__detalle"></p>
    <div class="cancelacion-dialogo__acciones">
      <button type="button" class="btn btn--secondary" id="cancelacion-volver">Conservar cita</button>
      <button type="button" class="btn btn--primary" id="cancelacion-confirmar">Sí, cancelar cita</button>
    </div>
  </dialog>
  <script type="module" src="js/cliente.js?v=cancelar-1"></script>
</body>
</html>
