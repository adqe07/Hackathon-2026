<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Negocio | Mova</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/variables.css?v=panel-mova-1">
  <link rel="stylesheet" href="css/panel-mova.css?v=6">
</head>
<body class="panel-mova">

<!-- HEADER -->
<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo" aria-label="Mova, inicio">
      <img src="imagenes/logo-acceso.png" alt="Mova" width="110" height="44">
    </a>
    <nav class="header-nav">
      <div id="panel-usuario-info" style="font-size:var(--text-sm);text-align:right;"></div>
      <button id="btn-logout" class="btn btn--ghost btn--sm">Salir</button>
    </nav>
  </div>
</header>

<!-- LAYOUT PANEL -->
<div class="panel-layout" id="panel-layout">

  <!-- SIDEBAR DESKTOP -->
  <aside class="panel-sidebar" aria-label="Menú del panel">
    <nav class="panel-nav" role="navigation">
      <button class="panel-nav__item" data-seccion="dashboard">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg> Dashboard
      </button>
      <button class="panel-nav__item" data-seccion="productos">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4M12 11v10M7.5 5l9 4"/></svg> Productos
      </button>
      <button class="panel-nav__item" data-seccion="servicios">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M8.1 14.9 20 3M15.9 14.9 4 3"/></svg> Servicios
      </button>
      <button class="panel-nav__item" data-seccion="citas">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg> Citas
      </button>
      <button class="panel-nav__item" data-seccion="apartados">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Zm4 0V6a3 3 0 0 1 6 0v2"/></svg> Apartados
      </button>
    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="panel-main" id="panel-main" aria-live="polite">

    <!-- Secciones (se muestran/ocultan por JS) -->
    <section class="panel-seccion" id="sec-dashboard" style="display:none;">
      <!-- Se llena por panel.js → cargarDashboard() -->
    </section>

    <section class="panel-seccion" id="sec-productos" style="display:none;">
      <!-- Se llena por panel.js → cargarProductos() -->
    </section>

    <section class="panel-seccion" id="sec-servicios" style="display:none;">
      <!-- Se llena por panel.js → cargarServicios() -->
    </section>

    <section class="panel-seccion" id="sec-citas" style="display:none;">
      <!-- Se llena por panel.js → cargarCitas() -->
    </section>

    <section class="panel-seccion" id="sec-apartados" style="display:none;">
      <!-- Se llena por panel.js → cargarApartados() -->
    </section>

  </main>
</div>

<!-- NAV INFERIOR MOBILE (Panel) -->
<nav class="bottom-nav panel-bottom-nav" aria-label="Navegación del panel">
  <button class="bottom-nav__item panel-nav__item" data-seccion="dashboard">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg><span>Dashboard</span>
  </button>
  <button class="bottom-nav__item panel-nav__item" data-seccion="productos">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4M12 11v10M7.5 5l9 4"/></svg><span>Productos</span>
  </button>
  <button class="bottom-nav__item panel-nav__item" data-seccion="citas">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg><span>Citas</span>
  </button>
  <button class="bottom-nav__item panel-nav__item" data-seccion="servicios">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M8.1 14.9 20 3M15.9 14.9 4 3"/></svg><span>Servicios</span>
  </button>
  <button class="bottom-nav__item panel-nav__item" data-seccion="apartados">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Zm4 0V6a3 3 0 0 1 6 0v2"/></svg><span>Apartados</span>
  </button>
  <button class="bottom-nav__item" id="btn-logout-mobile" style="color:var(--color-danger);">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 21H5V3h10v4M14 12h8m-3-3 3 3-3 3"/></svg><span>Salir</span>
  </button>
</nav>

<template id="producto-upload-fields">
  <div class="form-group">
    <label class="form-label" for="producto-imagen">Imagen (JPEG, PNG o WebP; máximo 3 MB)</label>
    <input type="file" id="producto-imagen" name="imagen" class="form-control"
           accept="image/jpeg,image/png,image/webp">
    <div class="upload-preview" id="producto-imagen-preview" hidden>
      <img alt="Vista previa de la imagen">
    </div>
  </div>
</template>

<script type="module">
  import { initPanel } from './js/panel.js?v=panel-mova-3';
  initPanel();
</script>

</body>
</html>
